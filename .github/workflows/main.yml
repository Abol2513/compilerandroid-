name: TitanDroid Architect CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Package Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses & install API 36 toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          sdkmanager "platforms;android-36.1" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK alignment & signature
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$DEBUG_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$DEBUG_APK"

      - name: Check release signing secrets
        id: check_secrets
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Release Keystore (if configured)
        if: steps.check_secrets.outputs.has_release == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"

      - name: Build & Verify Signed Release APK + AAB
        if: steps.check_secrets.outputs.has_release == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$RELEASE_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$RELEASE_APK"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: titandroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK & AAB Artifacts
        if: steps.check_secrets.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: titandroid-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
